name: Publish public website and advertisement assets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate advertisement catalog
        run: node tests/ad-catalog-smoke.cjs
      - name: Build public website, downloads, and ad feed
        run: node scripts/build-public-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
