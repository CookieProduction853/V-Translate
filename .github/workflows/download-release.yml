name: Publish verified Windows download
on:
  push:
    branches: [main]
    paths:
      - 'release-input/Windows-x64/**'
      - 'scripts/assemble-release.cjs'
      - '.github/workflows/download-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-download-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and verify the complete ZIP
        run: node scripts/assemble-release.cjs release-input/Windows-x64 release-output
      - name: Publish one complete downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(node -p "require('./release-output/release-Windows-x64.json').tag")
          version=$(node -p "require('./release-output/release-Windows-x64.json').version")
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "V-Translate v$version Windows x64" --notes "Verified Windows package. Includes video mode and standalone audio tools. Close the old background app, extract the whole ZIP, and run V-Translate.exe." --draft
          fi
          gh release upload "$tag" release-output/* --clobber
          gh release edit "$tag" --draft=false --latest
      - name: Retain public publication evidence
        run: |
          set -euo pipefail
          cp release-output/release-Windows-x64.json release-output/PUBLICATION_REPORT.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          parent="$(git ls-remote origin refs/heads/artifacts/windows-release | cut -f1)"
          if [ -n "$parent" ]; then git fetch --depth 1 origin "$parent"; fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/windows-release-index"
          git read-tree --empty
          blob="$(git hash-object -w release-output/PUBLICATION_REPORT.json)"
          git update-index --add --cacheinfo "100644,$blob,PUBLICATION_REPORT.json"
          tree="$(git write-tree)"
          if [ -n "$parent" ]; then
            commit="$(printf 'Verified Windows release %s\n' "$GITHUB_SHA" | git commit-tree "$tree" -p "$parent")"
          else
            commit="$(printf 'Verified Windows release %s\n' "$GITHUB_SHA" | git commit-tree "$tree")"
          fi
          git push origin "$commit:refs/heads/artifacts/windows-release"
